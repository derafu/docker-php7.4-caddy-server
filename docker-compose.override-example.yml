#
# Docker Compose override file.
#

# Services.
services:

  # Webserver container.
  webserver:

    # Volumes.
    volumes:
      - ${VOLUME_CADDY:-./config/caddy}:/etc/caddy
      # No SSH keys are baked into the image. To allow SSH access, mount
      # your own authorized_keys (and optionally a client id_rsa/id_rsa.pub)
      # here. entrypoint.sh fixes ownership/permissions on every start.
      - ${VOLUME_SSH:-./config/ssh}:/home/${WWW_USER:-admin}/.ssh

    # Ports mapping to the host.
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${SSH_PORT:-2222}:22"
      - "${MANAGER_PORT:-9090}:9090"

    # Networks.
    networks:
      - webserver-net

# Networks.
networks:
  webserver-net:
    name: webserver-net
    driver: bridge
