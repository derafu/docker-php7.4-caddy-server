name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'config/**'
      - 'entrypoint.sh'
      - '.github/workflows/publish-image.yml'
      - '.github/workflows/test-image.yml'

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test-image.yml

  publish:
    name: Build and publish (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      # Sequential, not parallel: php-base (listed first) compiles PHP from
      # source and warms the shared GHA cache; default/hardened only differ
      # in their last layer, so they should hit that cache instead of each
      # also compiling PHP from scratch at the same time nothing is cached
      # for any of them yet.
      max-parallel: 1
      matrix:
        include:
          # Solo el PHP 7.4 parchado para CVE-2026-109618/109619 (stage
          # derafu-php-74-fpm), reusable como base de otros contenedores.
          - name: php-base
            target: derafu-php-74-fpm
            build_args: ''
            tags: |
              ghcr.io/derafu/php:7.4.34-derafu-fpm
              ghcr.io/derafu/php:${{ github.sha }}

          # Contenedor completo, con los defaults de .env-dist (exec/
          # shell_exec disponibles: lo necesita Controller::shell() del
          # framework).
          - name: default
            target: ''
            build_args: ''
            tags: |
              ghcr.io/derafu/docker-php7.4-caddy-server:latest
              ghcr.io/derafu/docker-php7.4-caddy-server:${{ github.sha }}

          # Contenedor completo, variante endurecida: exec/shell_exec/etc.
          # bloqueados a nivel de PHP-FPM. Solo para un sitio confirmado
          # (revisando su código) que no necesita ninguna de esas funciones.
          - name: hardened
            target: ''
            build_args: |
              PHP_DISABLE_FUNCTIONS=exec,shell_exec,system,passthru,proc_open,popen
            tags: |
              ghcr.io/derafu/docker-php7.4-caddy-server:hardened
              ghcr.io/derafu/docker-php7.4-caddy-server:hardened-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          # amd64 only for now: GitHub's runners are amd64 native (no
          # emulation), and compiling PHP from source under QEMU for arm64
          # was failing intermittently near the end of ~60min builds. This
          # is meant to be temporary infrastructure anyway (until the
          # migration to PHP 8.5), not worth hardening multi-arch for.
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
